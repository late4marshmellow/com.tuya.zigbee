name: Validate Drivers (Enhanced)

on:
  push:
    paths:
      - 'drivers/**'
      - 'lib/**'
  pull_request:
    paths:
      - 'drivers/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci || npm install

      - name: Check duplicate Flow card IDs across drivers
        run: |
          node -e "
            const fs = require('fs'), path = require('path');
            const driversDir = path.join(process.cwd(), 'drivers');
            const seen = {};
            let fail = false;
            for (const d of fs.readdirSync(driversDir)) {
              const fp = path.join(driversDir, d, 'driver.flow.compose.json');
              if (!fs.existsSync(fp)) continue;
              let flow;
              try { flow = JSON.parse(fs.readFileSync(fp, 'utf8')); } catch { continue; }
              for (const type of ['triggers','conditions','actions']) {
                for (const card of flow[type] || []) {
                  if (!card.id) continue;
                  if (seen[card.id]) {
                    console.error('DUPLICATE flow card id \"' + card.id + '\" in driver \"' + d + '\" (also in \"' + seen[card.id] + '\")');
                    fail = true;
                  } else {
                    seen[card.id] = d;
                  }
                }
              }
            }
            if (fail) process.exit(1);
            console.log('No duplicate flow card IDs found across drivers (' + Object.keys(seen).length + ' IDs checked).');
          "

      - name: Validate Homey SDK Constraints
        run: |
          npx homey app validate --level publish

      - name: Validate Multi-instance Endpoints & Constraints
        run: |
          echo "Checking capabilities mapping to endpoints recursively..."
          node .github/scripts/deep-code-audit.js || true

      - name: Validate DP Mappings & Orphan DPs
        run: |
          node .github/scripts/dp-learning-system.js || true

      - name: Recursive Device Variance Testing
        run: |
          echo "Recursive test of manufacturer variants for device IDs"
          node .github/scripts/full-fork-verifier.js || true
